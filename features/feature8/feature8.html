<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Ball Game</title>
    <!-- Liên kết đến CSS chính và CSS của feature -->
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="feature8.css">
</head>

<body>
    <a href="../../index.html" class="home-link">Trang chủ</a>
    <canvas id="gameCanvas"></canvas>
    <div id="score">Score: 0</div>
    <div id="difficulty">Tier 1: 100% very easy</div>
    <div id="instructions">
        <h2 id="game-title">Ball Game</h2>
        <p id="game-message">Use arrow keys or WASD to move the ball. Avoid the obstacles.</p>
        <label for="tier-select">Choose a tier</label>
        <select id="tier-select">
            <option value="1">1 - Very easy</option>
            <option value="2">2 - Easy</option>
            <option value="3">3 - 50% easy, 50% medium</option>
            <option value="4">4 - 25% easy, 75% medium</option>
            <option value="5">5 - Medium</option>
            <option value="6">6 - 50% medium, 50% hard</option>
            <option value="7">7 - 25% medium, 75% hard</option>
            <option value="8">8 - Hard</option>
            <option value="9">9 - 50% hard, 50% expert</option>
            <option value="10">10 - Expert</option>
        </select>
        <p id="tier-description" aria-live="polite">Tier 1: 100% very easy obstacles.</p>
        <button id="start-button" type="button">Start game</button>
    </div>
    <script src="feature8.js"></script>
</body>

</html>
